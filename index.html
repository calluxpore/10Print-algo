<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ten Print</title>
  <meta name="description" content="Turn any image into a 10 PRINT maze and its Truchet cousins. Upload, tune, export PNG or SVG.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- taste-skill-ignore: Plex Mono for the BASIC line and seed only -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231b6c80'/%3E%3Cpath d='M3 8 8 3M8 13 13 8M8 3l5 5M3 8l5 5' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shell: tinted frame (stone, from the print shop) holding a 48px bar and three panels.
       Desktop grid: 8px outer margin · 280 left · 12 gap · fluid stage · 12 gap · 312 right · 8px margin. -->
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="var(--accent)"/>
        <path d="M4 12 12 4M12 20l8-8M12 4l8 8M4 12l8 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="brand-name">Ten Print</span>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <div class="doc">
      <h1 id="docName">Sample sphere</h1>
      <span class="pill" id="tileCount">0 tiles</span>
    </div>
    <div class="bar-actions">
      <button class="icon-btn" id="compareBtn" type="button" aria-label="Hold to compare with the source image" title="Hold to see the source (C)" aria-keyshortcuts="C">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></svg>
      </button>
      <button class="icon-btn" id="shuffleBtn" type="button" aria-label="Shuffle seed and variations" title="Shuffle seed and variations (Space)" aria-keyshortcuts="Space">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5h2.2c1.4 0 2.2.6 3 1.8l2.6 3.4c.8 1.2 1.6 1.8 3 1.8h2.2M1.5 11.5h2.2c1.4 0 2.2-.6 3-1.8M9.3 6.3c.8-1.2 1.6-1.8 3-1.8h2.2M12.8 2.8l1.7 1.7-1.7 1.7M12.8 9.8l1.7 1.7-1.7 1.7"/></svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <label class="btn btn-secondary" for="fileInput">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V2.5M4.8 5.7 8 2.5l3.2 3.2M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>
        <span>Upload image</span>
      </label>
      <button class="btn btn-secondary" id="svgBtn" type="button">SVG</button>
      <button class="btn btn-primary" id="pngBtn" type="button" title="Export PNG (Ctrl+S)" aria-keyshortcuts="Control+S">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.8 7.3 8 10.5l3.2-3.2M2.5 13.5h11"/></svg>
        <span>Export PNG</span>
      </button>
    </div>
  </header>

  <main class="work">
    <!-- Left: source and pattern -->
    <aside class="panel left" aria-label="Source and pattern">
      <section class="group" aria-labelledby="srcHead">
        <h2 id="srcHead">Source</h2>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" class="sr-only" aria-describedby="fileHint">
        <label for="fileInput" class="drop" id="drop">
          <span class="drop-thumb"><canvas id="srcThumb" width="96" height="96" aria-hidden="true"></canvas></span>
          <span class="drop-text">
            <span class="drop-name" id="srcName">Sample sphere</span>
            <span class="drop-meta" id="srcMeta">800 × 800 px</span>
            <span class="drop-action">Drop, paste or browse</span>
          </span>
        </label>
        <p class="hint" id="fileHint">PNG, JPG, WebP, GIF or AVIF. Stays on your device.</p>
        <p class="error" id="fileError" role="alert" hidden></p>
        <button class="link-btn" id="sampleBtn" type="button" hidden>Back to the sample</button>
      </section>

      <section class="group grow" aria-labelledby="patHead">
        <h2 id="patHead">Pattern</h2>
        <div class="patterns" id="patterns" role="radiogroup" aria-labelledby="patHead"></div>
      </section>
    </aside>

    <!-- Centre: the canvas -->
    <section class="panel stage" aria-label="Pattern preview">
      <div class="well" id="well">
        <div class="canvas-host" id="canvasHost"></div>
        <div class="drop-veil" id="dropVeil" hidden><span>Drop to use this image</span></div>
      </div>
      <div class="stage-foot">
        <p class="rule" id="ruleLine"></p>
        <p class="dims" id="dims"></p>
      </div>
    </section>

    <!-- Right: variation controls -->
    <aside class="panel right" aria-label="Variations">
      <form id="controls" class="controls" autocomplete="off">
        <section class="group" aria-labelledby="gTiles">
          <h2 id="gTiles">Tiles</h2>
          <div class="field">
            <div class="field-top"><label for="across">Tiles across</label><output for="across" id="o-across"></output></div>
            <input type="range" id="across" name="across" min="8" max="240" step="1">
          </div>
          <div class="field" id="weightField">
            <div class="field-top"><label for="weight">Line weight</label><output for="weight" id="o-weight"></output></div>
            <input type="range" id="weight" name="weight" min="2" max="60" step="1" aria-describedby="weightNote">
            <p class="note" id="weightNote" hidden>Filled tiles have no line. Size follows tone instead.</p>
          </div>
          <fieldset class="field seg-field" id="capField">
            <legend>Line ends</legend>
            <div class="seg">
              <input type="radio" name="cap" id="cap-round" value="round"><label for="cap-round">Round</label>
              <input type="radio" name="cap" id="cap-butt" value="butt"><label for="cap-butt">Flat</label>
              <input type="radio" name="cap" id="cap-square" value="square"><label for="cap-square">Square</label>
            </div>
          </fieldset>
        </section>

        <section class="group" aria-labelledby="gImage">
          <h2 id="gImage">Image</h2>
          <div class="field">
            <div class="field-top"><label for="influence">Image steers direction</label><output for="influence" id="o-influence"></output></div>
            <input type="range" id="influence" name="influence" min="0" max="100" step="1">
          </div>
          <div class="field">
            <div class="field-top"><label for="toneWeight">Tone sets thickness</label><output for="toneWeight" id="o-toneWeight"></output></div>
            <input type="range" id="toneWeight" name="toneWeight" min="0" max="100" step="1">
          </div>
          <div class="field">
            <div class="field-top"><label for="contrast">Contrast</label><output for="contrast" id="o-contrast"></output></div>
            <input type="range" id="contrast" name="contrast" min="-100" max="100" step="1">
          </div>
          <div class="field">
            <div class="field-top"><label for="cutoff">Drop tiles lighter than</label><output for="cutoff" id="o-cutoff"></output></div>
            <input type="range" id="cutoff" name="cutoff" min="0" max="100" step="1">
          </div>
          <div class="field">
            <div class="field-top"><label for="underlay">Show source beneath</label><output for="underlay" id="o-underlay"></output></div>
            <input type="range" id="underlay" name="underlay" min="0" max="100" step="1">
          </div>
          <label class="switch">
            <input type="checkbox" id="invert" name="invert">
            <span class="switch-track" aria-hidden="true"></span>
            <span>Invert tones</span>
          </label>
        </section>

        <section class="group" aria-labelledby="gChance">
          <h2 id="gChance">Chance</h2>
          <div class="field">
            <div class="field-top"><label for="balance">Balance</label><output for="balance" id="o-balance"></output></div>
            <input type="range" id="balance" name="balance" min="-50" max="50" step="1">
          </div>
          <div class="field">
            <label for="seed" class="field-label">Seed</label>
            <div class="joined">
              <input type="number" id="seed" name="seed" min="0" max="999999" step="1" inputmode="numeric">
              <button type="button" id="seedBtn" class="btn btn-secondary">New seed</button>
            </div>
          </div>
        </section>

        <section class="group" aria-labelledby="gColour">
          <h2 id="gColour">Colour</h2>
          <div class="presets" id="presets" role="group" aria-label="Colour presets"></div>
          <fieldset class="field seg-field">
            <legend>Ink comes from</legend>
            <div class="seg">
              <input type="radio" name="colorMode" id="cm-ink" value="ink"><label for="cm-ink">One ink</label>
              <input type="radio" name="colorMode" id="cm-two" value="two"><label for="cm-two">Two inks</label>
              <input type="radio" name="colorMode" id="cm-image" value="image"><label for="cm-image">Image</label>
            </div>
          </fieldset>
          <div class="swatches">
            <label class="swatch"><input type="color" id="bg" name="bg"><span>Paper</span></label>
            <label class="swatch"><input type="color" id="ink" name="ink"><span>Ink</span></label>
            <label class="swatch" id="ink2Wrap"><input type="color" id="ink2" name="ink2"><span>Second ink</span></label>
          </div>
        </section>

        <section class="group" aria-labelledby="gOut">
          <h2 id="gOut">Output</h2>
          <div class="field">
            <label for="size" class="field-label">Long side</label>
            <select id="size" name="size">
              <option value="1080">1,080 px</option>
              <option value="1600">1,600 px</option>
              <option value="2400">2,400 px</option>
              <option value="3200">3,200 px</option>
            </select>
          </div>
          <button type="button" class="link-btn" id="resetBtn">Reset all variations</button>
        </section>
      </form>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.0.3/lib/p5.min.js"></script>
  <script src="patterns.js"></script>
  <script src="app.js"></script>
</body>
</html>
